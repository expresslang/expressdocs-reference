name: macos

on:
  push:
    branches: [ master, main ]
  pull_request:
    paths-ignore:
      - .gitlab-ci.yml
      - .github/workflows/test.yml
      - .github/workflows/docker.yml
      - .github/workflows/ubuntu.yml
      - .github/workflows/windows.yml
      - .github/workflows/docker-pres_xml.yml

jobs:
  test-macos:
    name: Test on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          token: ${{ secrets.METANORMA_CI_PAT_TOKEN || github.token }}
          submodules: true

      - name: Checkout iso-10303-stepmod repo
        uses: actions/checkout@v2
        with:
          token: ${{ secrets.METANORMA_CI_PAT_TOKEN || github.token }}
          repository: metanorma/iso-10303-stepmod
          ref: master
          path: stepmod

      - name: Install Metanorma
        run: brew install metanorma/metanorma/metanorma

      - name: Use Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.6

      - name: Bundle
        run: |
          bundle install -j 4

      - name: Download stepmod2mn and convert SVGs
        run: |
          wget https://github.com/metanorma/stepmod2mn/releases/download/v1.5/stepmod2mn-1.5.jar
          java -jar stepmod2mn-1.5.jar stepmod -svg
          git ls-files -- *.svg | xargs -I '{}' cp stepmod/{} {}

      - name: Metanorma compile
        env:
          JAVA_OPTS: "java.awt.headless=true"
        run: |
          bundle exec metanorma site generate --agree-to-terms

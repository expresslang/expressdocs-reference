name: ubuntu

on:
  push:
    branches: [ master, main ]
  pull_request:
    paths-ignore:
      - .gitlab-ci.yml
      - .github/workflows/test.yml
      - .github/workflows/macos.yml
      - .github/workflows/docker.yml
      - .github/workflows/windows.yml
      - .github/workflows/docker-pres_xml.yml

jobs:
  test-linux:
    name: Test on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v2
        with:
          token: ${{ secrets.METANORMA_CI_PAT_TOKEN || github.token }}
          submodules: true

      - name: Checkout iso-10303-stepmod repo
        uses: actions/checkout@v2
        with:
          token: ${{ secrets.METANORMA_CI_PAT_TOKEN || github.token }}
          repository: metanorma/iso-10303-stepmod
          ref: master
          path: stepmod

      - name: Use Metanorma
        run: |
          sudo apt-get update
          curl -L https://raw.githubusercontent.com/metanorma/metanorma-linux-setup/master/ubuntu.sh | sudo bash
          sudo chown -R $USER:$(id -gn $USER) $HOME/.config

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.6

      - name: Bundle
        run: |
          bundle install -j 4

      - name: Download stepmod2mn and convert SVGs
        run: |
          wget https://github.com/metanorma/stepmod2mn/releases/download/v1.6/stepmod2mn-1.6.jar
          java -jar stepmod2mn-1.6.jar stepmod -svg
          git ls-files -- *.svg | xargs -I '{}' cp stepmod/{} {}

      - name: Metanorma compile
        env:
          JAVA_OPTS: "java.awt.headless=true"
        run: |
          bundle exec metanorma site generate --agree-to-terms
